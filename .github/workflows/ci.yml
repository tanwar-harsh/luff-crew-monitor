name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Committed bundle is up to date
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code dist/
      - run: npm test

  runtime:
    # The bundle must still start on the oldest supported Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18.17
      - run: node dist/luff-crew.mjs --version
      - run: node dist/luff-crew.mjs --help
